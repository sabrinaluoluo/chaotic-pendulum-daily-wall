            cloud.addColorStop(0, `rgba(${i % 2 ? "218,146,204" : "170,137,204"},${alpha})`);
            cloud.addColorStop(0.32, `rgba(${i % 2 ? "185,102,170" : "133,111,179"},${alpha * 0.55})`);
            cloud.addColorStop(1, "rgba(62,27,78,0)");
            ctx.fillStyle = cloud;
            ctx.beginPath();
            ctx.arc(x, y, radius, 0, TAU);
            ctx.fill();
          }

          for (const dust of milkyDust) {
            const drift = (t * (0.0000024 + dust.layer * 0.0000018)) % 1.45;
            let along = dust.along + drift;
            if (along > 1.22) along -= 1.45;
            const pathY = height * (
              0.84
              - along * 0.66
              + 0.075 * Math.sin(along * 5.4 + 0.35)
              + 0.028 * Math.sin(along * 14.7 + 1.2)
            );
            const scatter = dust.spread * width * (0.76 + 0.24 * Math.sin(along * 9.6 + dust.phase));
            const x = along * width + Math.sin(dust.phase + t * 0.00003) * 5 * dust.layer;
            const y = pathY + scatter + Math.cos(dust.phase + t * 0.000025) * 3 * dust.layer;
            if (x < -10 || x > width + 10 || y < -10 || y > height + 10) continue;
            const twinkle = 0.74 + 0.26 * Math.sin(t * 0.00055 + dust.phase);
            const density = 0.5 + 0.5 * Math.pow(Math.sin(along * 11.5 + 0.7), 2);
            const color = dust.tint > 0.82 ? "239,171,215" : dust.tint > 0.43 ? "207,175,225" : "232,205,225";
            ctx.fillStyle = `rgba(${color},${dust.alpha * twinkle * (0.58 + density * 0.62)})`;
            ctx.beginPath();
            ctx.arc(x, y, dust.size * (0.75 + dust.layer * 0.45), 0, TAU);
            ctx.fill();
          }

          for (const star of stars) {
            const speed = [0.000003, 0.000006, 0.000011][star.depth];
            let x = (star.x + t * speed) % 1;
            let y = (star.y + t * speed * 0.17) % 1;
            x *= width;
            y *= height;
            const pulse = 0.72 + Math.sin(t * 0.0008 + star.phase) * 0.28;
            const color = star.tint > 0.93 ? "244,174,218" : star.tint > 0.55 ? "220,195,232" : "235,222,235";
            ctx.fillStyle = `rgba(${color},${star.alpha * pulse})`;
            ctx.beginPath();
            ctx.arc(x, y, star.size, 0, TAU);
            ctx.fill();
            if (star.depth === 2 && star.size > 1.18 && star.alpha > 0.62) {
              ctx.strokeStyle = `rgba(${color},${star.alpha * pulse * 0.24})`;
              ctx.lineWidth = 0.7;
              ctx.beginPath();
              ctx.moveTo(x - star.size * 3.5, y);
              ctx.lineTo(x + star.size * 3.5, y);
              ctx.moveTo(x, y - star.size * 3.5);
              ctx.lineTo(x, y + star.size * 3.5);
              ctx.stroke();
            }
          }
          ctx.restore();
        }

        function drawFigureArt(t) {
          if (!figureArt.complete || !figureArt.naturalWidth) return;
          const driftX = Math.sin(t * 0.00011) * 3.5;
          const driftY = Math.cos(t * 0.00009) * 4.5;
          const breathe = 1.008 + Math.sin(t * 0.00007) * 0.004;
          const drawWidth = width * breathe;
          const drawHeight = height * breathe;
          ctx.save();
          ctx.globalCompositeOperation = "screen";
          ctx.globalAlpha = 0.205;
          ctx.filter = "saturate(0.7) brightness(0.78) contrast(1.08)";
          ctx.drawImage(
            figureArt,
            (width - drawWidth) / 2 + driftX,
            (height - drawHeight) / 2 - height * 0.025 + driftY,
            drawWidth,
            drawHeight,
          );
          ctx.filter = "none";
          ctx.restore();
        }

        function drawAgent(agent, t) {
          const orbit = t * (0.000035 + agent.index * 0.0000017) + agent.phase;
          const x = agent.x * width + Math.cos(orbit) * (8 + agent.index % 3 * 3);
          const y = agent.y * height + Math.sin(orbit * 0.83) * (6 + agent.index % 4 * 2);
          const r = agent.radius * Math.min(width / 1280, height / 960);
          const lightX = x - r * 0.34 + Math.cos(t * 0.00013 + agent.phase) * r * 0.12;
          const lightY = y - r * 0.28;

          ctx.save();
          ctx.globalCompositeOperation = "screen";
          glowDot(x, y, r * 0.82, `hsla(${agent.hue},40%,82%,0.26)`, `hsla(${agent.hue},55%,50%,0.07)`, 0.85);
          const sphere = ctx.createRadialGradient(lightX, lightY, r * 0.08, x, y, r * 1.1);
          sphere.addColorStop(0, `hsla(${agent.hue},33%,86%,0.78)`);
          sphere.addColorStop(0.45, `hsla(${agent.hue},34%,56%,0.42)`);
          sphere.addColorStop(1, `hsla(${agent.hue},44%,14%,0.18)`);
          ctx.fillStyle = sphere;
          ctx.beginPath();
          ctx.arc(x, y, r, 0, TAU);
          ctx.fill();

          if (agent.ring) {
            ctx.translate(x, y);
            ctx.rotate(agent.phase * 0.72 + Math.sin(t * 0.00008 + agent.phase) * 0.08);
            ctx.scale(1, 0.34 + (agent.index % 2) * 0.08);
            ctx.strokeStyle = `hsla(${agent.hue},42%,76%,0.24)`;
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.ellipse(0, 0, r * 1.76, r * 1.76, 0, 0, TAU);
            ctx.stroke();
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          }

          if (agent.moon) {
            const moonAngle = t * (0.00022 + agent.index * 0.000006) + agent.phase;
            const mx = x + Math.cos(moonAngle) * r * 2.05;
            const my = y + Math.sin(moonAngle) * r * 0.82;
            ctx.fillStyle = `hsla(${agent.hue},35%,82%,0.42)`;
            ctx.beginPath();
            ctx.arc(mx, my, Math.max(1.2, r * 0.13), 0, TAU);
            ctx.fill();
          }
          ctx.restore();
        }

        function pendulumPoints() {
          const scale = Math.min(width / 1280, height / 960);
          const anchor = { x: width * 0.535, y: height * 0.32 };
          const l1 = 172 * scale;
          const l2 = 153 * scale;
          const joint = {
            x: anchor.x + Math.sin(state.a1) * l1,
            y: anchor.y + Math.cos(state.a1) * l1,
          };
          const end = {
            x: joint.x + Math.sin(state.a2) * l2,
            y: joint.y + Math.cos(state.a2) * l2,
          };
          return { anchor, joint, end, scale };
        }

        function linePoint(a, b, p) {
          return { x: a.x + (b.x - a.x) * p, y: a.y + (b.y - a.y) * p };
        }

        function drawMagpie(x, y, angle, size, alpha, color) {
          ctx.save();
          ctx.translate(x, y);
          ctx.rotate(angle);
          ctx.strokeStyle = color.replace("ALPHA", String(alpha));
          ctx.lineWidth = Math.max(0.8, size * 0.13);
          ctx.lineCap = "round";
          ctx.beginPath();
          ctx.moveTo(-size, size * 0.15);
          ctx.quadraticCurveTo(-size * 0.34, -size * 0.58, 0, 0);
          ctx.quadraticCurveTo(size * 0.34, -size * 0.58, size, size * 0.15);
          ctx.stroke();
          ctx.restore();
        }

        function drawBridgeArm(a, b, t, reverse = false) {
          const angle = Math.atan2(b.y - a.y, b.x - a.x);
          const length = Math.hypot(b.x - a.x, b.y - a.y);
          const gradient = ctx.createLinearGradient(a.x, a.y, b.x, b.y);
          gradient.addColorStop(0, reverse ? "rgba(230,136,199,0.8)" : "rgba(244,183,218,0.78)");
          gradient.addColorStop(0.5, "rgba(220,220,247,0.72)");
          gradient.addColorStop(1, reverse ? "rgba(244,183,218,0.78)" : "rgba(230,136,199,0.8)");

          ctx.save();
          ctx.globalCompositeOperation = "screen";
          ctx.strokeStyle = gradient;
          ctx.lineWidth = 1.7;
          ctx.shadowColor = reverse ? "rgba(217,102,178,0.52)" : "rgba(232,145,198,0.52)";
          ctx.shadowBlur = 15;
          ctx.beginPath();
          ctx.moveTo(a.x, a.y);
          ctx.lineTo(b.x, b.y);
          ctx.stroke();
          ctx.shadowBlur = 0;

          const count = Math.max(7, Math.floor(length / 20));
          const pulse = (t * 0.000085) % 1;
          for (let i = 1; i < count; i += 1) {
            const p = i / count;
            const point = linePoint(a, b, p);
            const wave = Math.sin(p * Math.PI * 2 + t * 0.0011 + i) * 2.3;
            point.x += Math.cos(angle + Math.PI / 2) * wave;
            point.y += Math.sin(angle + Math.PI / 2) * wave;
            const proximity = Math.max(0, 1 - Math.abs(p - pulse) * 5.5);
            drawMagpie(
              point.x,
              point.y,
              angle,
              2.8 + proximity * 1.8,
              0.26 + proximity * 0.65,
              reverse ? "rgba(238,156,210,ALPHA)" : "rgba(244,188,221,ALPHA)",
            );
          }
          ctx.restore();
        }

        function drawJadeShuttle(point, angle, scale, t) {
          ctx.save();
          ctx.globalCompositeOperation = "screen";
          glowDot(point.x, point.y, 7 * scale, "rgba(250,220,237,0.9)", "rgba(207,112,170,0.1)", 0.9);
          ctx.translate(point.x, point.y);
          ctx.rotate(angle + Math.sin(t * 0.00018) * 0.035);
          const length = 22 * scale;
          const halfHeight = 7.5 * scale;
          const jade = ctx.createLinearGradient(-length, 0, length, 0);
          jade.addColorStop(0, "rgba(191,130,180,0.42)");
          jade.addColorStop(0.38, "rgba(255,231,244,0.96)");
          jade.addColorStop(0.68, "rgba(232,175,211,0.82)");
          jade.addColorStop(1, "rgba(151,98,156,0.34)");
          ctx.fillStyle = jade;
          ctx.strokeStyle = "rgba(250,220,239,0.6)";
          ctx.lineWidth = 1.1 * scale;
          ctx.shadowColor = "rgba(232,139,197,0.58)";
          ctx.shadowBlur = 14 * scale;
          ctx.beginPath();
          ctx.moveTo(-length, 0);
          ctx.quadraticCurveTo(-length * 0.18, -halfHeight * 1.25, length, 0);
          ctx.quadraticCurveTo(-length * 0.18, halfHeight * 1.25, -length, 0);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();
          ctx.shadowBlur = 0;
          ctx.fillStyle = "rgba(20,4,25,0.62)";
          ctx.beginPath();
          ctx.ellipse(0, 0, 5.4 * scale, 2.2 * scale, 0, 0, TAU);
          ctx.fill();
          ctx.restore();
        }

        function drawNeedleEye(point, angle, scale, t) {
          ctx.save();
          glowDot(point.x, point.y, 8.5 * scale, "rgba(248,224,240,0.92)", "rgba(189,112,178,0.1)", 0.85);
          ctx.translate(point.x, point.y);
          ctx.rotate(angle + Math.sin(t * 0.00021) * 0.025);
          ctx.globalCompositeOperation = "source-over";
          ctx.fillStyle = "rgba(15,3,20,0.82)";
          ctx.beginPath();
          ctx.ellipse(0, 0, 14.5 * scale, 8.2 * scale, 0, 0, TAU);
          ctx.fill();
          ctx.globalCompositeOperation = "screen";
          const metal = ctx.createLinearGradient(-15 * scale, 0, 15 * scale, 0);
          metal.addColorStop(0, "rgba(170,131,187,0.5)");
          metal.addColorStop(0.45, "rgba(255,235,247,0.95)");
          metal.addColorStop(1, "rgba(222,151,201,0.58)");
          ctx.strokeStyle = metal;
          ctx.lineWidth = 2.2 * scale;
          ctx.shadowColor = "rgba(226,152,204,0.5)";
          ctx.shadowBlur = 12 * scale;
          ctx.beginPath();
          ctx.ellipse(0, 0, 14.5 * scale, 8.2 * scale, 0, 0, TAU);
          ctx.stroke();
          ctx.shadowBlur = 0;
          ctx.strokeStyle = "rgba(246,213,235,0.28)";
          ctx.lineWidth = 0.8 * scale;
          ctx.beginPath();
          ctx.ellipse(0, 0, 9.2 * scale, 3.9 * scale, 0, 0, TAU);
          ctx.stroke();
          ctx.restore();
        }

        function drawHeartKnot(point, scale, t) {
          const sway = Math.max(-0.34, Math.min(0.34, state.v2 * 0.055));
          const breathe = 1 + Math.sin(t * 0.00105) * 0.035;
          ctx.save();
          ctx.globalCompositeOperation = "screen";
          glowDot(point.x, point.y, 10.5 * scale, "rgba(247,181,220,0.68)", "rgba(196,65,145,0.1)", 0.82);
          ctx.translate(point.x, point.y);
          ctx.rotate(sway);
          ctx.scale(scale * breathe, scale * breathe);
          const thread = ctx.createLinearGradient(-24, -18, 24, 20);
          thread.addColorStop(0, "rgba(255,218,238,0.95)");
          thread.addColorStop(0.45, "rgba(246,160,210,0.96)");
          thread.addColorStop(1, "rgba(211,86,164,0.88)");
          ctx.strokeStyle = thread;
          ctx.lineWidth = 2.15;
          ctx.lineCap = "round";
          ctx.lineJoin = "round";
          ctx.shadowColor = "rgba(232,106,180,0.72)";
          ctx.shadowBlur = 15;
          ctx.beginPath();
          ctx.moveTo(0, 17);
          ctx.bezierCurveTo(-22, 3, -22, -16, -8, -18);
          ctx.bezierCurveTo(-2, -19, 1, -14, 0, -8);
          ctx.bezierCurveTo(2, -14, 7, -19, 13, -17);
          ctx.bezierCurveTo(27, -12, 22, 4, 0, 17);
          ctx.stroke();
          ctx.shadowBlur = 0;
          ctx.strokeStyle = "rgba(250,203,229,0.52)";
          ctx.lineWidth = 0.85;
          ctx.beginPath();
          ctx.moveTo(0, 17);
          ctx.bezierCurveTo(7, 22, 4, 29, 12, 33);
          ctx.bezierCurveTo(18, 36, 18, 42, 13, 47);
          ctx.stroke();
          ctx.beginPath();
          ctx.arc(0, 17, 3.2, 0, TAU);
          ctx.stroke();
          ctx.restore();
        }

        function drawPendulum(t) {
          const { anchor, joint, end, scale } = pendulumPoints();
          trail.push({ x: end.x, y: end.y, created: t });
          while (trail.length > 360 || (trail[0] && t - trail[0].created > 4800)) trail.shift();

          ctx.save();
          ctx.globalCompositeOperation = "screen";
          if (trail.length > 2) {
            for (let i = 1; i < trail.length; i += 1) {
              const age = (t - trail[i].created) / 4800;
              const alpha = Math.max(0, (1 - age) * 0.095);
              ctx.strokeStyle = i % 2 ? `rgba(211,126,197,${alpha})` : `rgba(245,171,214,${alpha})`;
              ctx.lineWidth = 0.75;
              ctx.beginPath();
              ctx.moveTo(trail[i - 1].x, trail[i - 1].y);
              ctx.lineTo(trail[i].x, trail[i].y);
              ctx.stroke();
            }
          }
          ctx.restore();

          drawBridgeArm(anchor, joint, t, false);
          drawBridgeArm(joint, end, t + 3300, true);
          const firstAngle = Math.atan2(joint.y - anchor.y, joint.x - anchor.x);
          const secondAngle = Math.atan2(end.y - joint.y, end.x - joint.x);
          const bisector = Math.atan2(
            Math.sin(firstAngle) + Math.sin(secondAngle),
            Math.cos(firstAngle) + Math.cos(secondAngle),
          );
          drawJadeShuttle(anchor, firstAngle, scale, t);
          drawNeedleEye(joint, bisector, scale, t);
          drawHeartKnot(end, scale, t);

          const meeting = (Math.sin(t * 0.00048) + 1) / 2;
          if (meeting > 0.92) {
            const p = (meeting - 0.92) / 0.08;
            const ringRadius = 22 * scale + p * 45 * scale;
            ctx.strokeStyle = `rgba(214,201,245,${(1 - p) * 0.2})`;
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.arc(joint.x, joint.y, ringRadius, 0, TAU);
            ctx.stroke();
          }
        }

        function draw(t) {
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          drawBackground(t);
          drawFigureArt(t);
          ctx.save();
          for (const agent of agents) drawAgent(agent, t);
          ctx.restore();
          drawPendulum(t);
        }

        function frame(now) {
          const elapsed = Math.min((now - previous) / 1000, 0.05);
          previous = now;
          accumulator += elapsed * 0.73;
          const step = 1 / 240;
          while (accumulator >= step) {
            integrate(step);
            accumulator -= step;
          }
          draw(now - start);
          requestAnimationFrame(frame);
        }

        function updateClock() {
          const now = new Date();
          const parts = new Intl.DateTimeFormat("zh-CN", {
            timeZone: "Asia/Shanghai",
            year: "numeric",
            month: "2-digit",
            day: "2-digit",
            weekday: "long",
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit",
            hour12: false,
          }).formatToParts(now);
          const values = Object.fromEntries(parts.map((part) => [part.type, part.value]));
          document.querySelector("#date").textContent = `${values.year}.${values.month}.${values.day} ${values.weekday}`;
          document.querySelector("#hm").textContent = `${values.hour}:${values.minute}`;
          document.querySelector("#seconds").textContent = values.second;
          document.querySelector("#time").dateTime = now.toISOString();
        }

        const weatherCodes = {
          0: "晴", 1: "晴间多云", 2: "多云", 3: "阴",
          45: "有雾", 48: "雾凇", 51: "细雨", 53: "小雨", 55: "细雨",
          61: "小雨", 63: "中雨", 65: "大雨", 80: "阵雨", 81: "阵雨", 82: "强阵雨",
          95: "雷阵雨", 96: "雷阵雨", 99: "强雷阵雨",
        };

        function aqiLabel(value) {
          if (!Number.isFinite(value)) return "";
          if (value <= 50) return "优";
          if (value <= 100) return "良";
          if (value <= 150) return "轻度";
          if (value <= 200) return "中度";
          return "较差";
        }

        async function updateEnvironment() {
          try {
            const [weatherResponse, airResponse] = await Promise.all([
              fetch("https://api.open-meteo.com/v1/forecast?latitude=22.5431&longitude=114.0579&current=temperature_2m,weather_code&timezone=Asia%2FShanghai", { cache: "no-store" }),
              fetch("https://air-quality-api.open-meteo.com/v1/air-quality?latitude=22.5431&longitude=114.0579&current=us_aqi,pm2_5&timezone=Asia%2FShanghai", { cache: "no-store" }),
            ]);
            if (!weatherResponse.ok || !airResponse.ok) throw new Error("environment unavailable");
            const weather = await weatherResponse.json();
            const air = await airResponse.json();
            const temperature = Math.round(weather.current.temperature_2m);
            const aqi = Math.round(air.current.us_aqi);
            const pm25 = Math.round(air.current.pm2_5);
            document.querySelector("#temperature").textContent = `${temperature}°C`;
            document.querySelector("#weather").textContent = weatherCodes[weather.current.weather_code] || "天气变化";
            document.querySelector("#aqi").textContent = `AQI ${aqi} · ${aqiLabel(aqi)}`;
            document.querySelector("#pm25").textContent = `PM2.5 ${pm25}`;
            const sync = new Intl.DateTimeFormat("zh-CN", {
              timeZone: "Asia/Shanghai",
              hour: "2-digit",
              minute: "2-digit",
              hour12: false,
            }).format(new Date());
            document.querySelector("#sync").textContent = `UPDATED ${sync}`;
          } catch {
            document.querySelector("#sync").textContent = "LIVE DATA OFFLINE";
          }
        }

        fitCanvas();
        new ResizeObserver(fitCanvas).observe(stage);
        updateClock();
        updateEnvironment();
        setInterval(updateClock, 1000);
        setInterval(updateEnvironment, 10 * 60 * 1000);
        requestAnimationFrame(frame);
      })();
    </script>
  </body>
</html>
