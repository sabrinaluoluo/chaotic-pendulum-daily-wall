    <style id="led-output-fix">
      /*
       * LED output mode
       * - Keep the 4:3 composition undistorted.
       * - Cover the viewport instead of letterboxing it.
       * - Add a tiny overscan to hide browser/processor rounding seams.
       */
      :root {
        --led-overscan: 1.006;
        --led-shift-x: 0px;
        --led-shift-y: 0px;
      }

      html,
      body,
      #root {
        width: 100% !important;
        height: 100% !important;
        min-width: 0 !important;
        min-height: 0 !important;
        margin: 0 !important;
        padding: 0 !important;
        overflow: hidden !important;
        background: #020707 !important;
      }

      .display-shell,
      .agent-field-shell {
        position: fixed !important;
        inset: 0 !important;
        display: block !important;
        width: 100vw !important;
        height: 100vh !important;
        min-width: 0 !important;
        min-height: 0 !important;
        overflow: hidden !important;
        background: #020707 !important;
      }

      .display-stage,
      .agent-field-stage {
        position: absolute !important;
        top: 50% !important;
        left: 50% !important;
        width: max(100vw, 133.333vh) !important;
        height: max(100vh, 75vw) !important;
        max-width: none !important;
        max-height: none !important;
        aspect-ratio: 4 / 3 !important;
        transform: translate(
            calc(-50% + var(--led-shift-x)),
            calc(-50% + var(--led-shift-y))
          )
          scale(var(--led-overscan)) !important;
        transform-origin: center center !important;
        overflow: hidden !important;
      }

      @supports (height: 100dvh) {
        .display-shell,
        .agent-field-shell {
          height: 100dvh !important;
        }

        .display-stage,
        .agent-field-stage {
          width: max(100vw, 133.333dvh) !important;
          height: max(100dvh, 75vw) !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script id="led-output-calibration">
      (() => {
        const params = new URLSearchParams(location.search);
        const clamp = (value, min, max) => Math.min(max, Math.max(min, value));
        const numberParam = (name, fallback) => {
          const value = Number(params.get(name));
          return Number.isFinite(value) ? value : fallback;
        };

        const overscan = clamp(numberParam("scale", 1.006), 1, 1.05);
        const shiftX = clamp(numberParam("x", 0), -40, 40);
        const shiftY = clamp(numberParam("y", 0), -40, 40);
        const root = document.documentElement;

        root.style.setProperty("--led-overscan", String(overscan));
        root.style.setProperty("--led-shift-x", `${shiftX}px`);
        root.style.setProperty("--led-shift-y", `${shiftY}px`);
        root.dataset.ledOutput = "cover";
      })();
    </script>
  </body>
