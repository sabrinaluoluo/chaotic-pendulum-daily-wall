    root.setProperty("--logo-spacing", `${content.logo.letterSpacingEm}em`);
  }

  function applyTextContent(content) {
    dom.logo.textContent = content.logo.text;
    dom.company.textContent = content.brandText.company;
    dom.companyDay.textContent = String(content.brandText.companyDay).padStart(4, "0");
    dom.themeTitle.textContent = content.brandText.themeTitle;
    dom.themeSubtitle.textContent = content.brandText.themeSubtitle;
    dom.lunarLabel.textContent = content.environment.lunarLabel;
    dom.lunarDataLabel.textContent = content.environment.lunarDataLabel;
    dom.location.textContent = content.environment.location;
    dom.locationEnglish.textContent = content.environment.locationEnglish;
    dom.disclosure.textContent = content.brandText.disclosure;
    dom.themeFacts.replaceChildren(...content.brandText.themeFacts.map((fact) => {
      const item = document.createElement("li");
      item.textContent = fact;
      return item;
    }));
  }

  function resetPhysics(content) {
    const initial = content.pendulum.initial;
    runtime.pendulum.angle1 = initial.angle1;
    runtime.pendulum.angle2 = initial.angle2;
    runtime.pendulum.velocity1 = initial.velocity1;
    runtime.pendulum.velocity2 = initial.velocity2;
    runtime.pendulum.trail.length = 0;
    runtime.nodeTextures.clear();
    runtime.particleFields.clear();
    runtime.startedAt = performance.now();
    runtime.accumulator = 0;
    runtime.lastFrameAt = 0;
    lastPhysicsAt = 0;
  }

  function setEnvironmentValues(values, source) {
    dom.temperature.textContent = `${Math.round(values.temperature)}°C`;
    dom.weather.textContent = values.weather;
    dom.aqi.textContent = `${runtime.content.environment.aqiStandard === "US" ? "US AQI" : "AQI"} ${Math.round(values.aqi)}`;
    dom.pm25.textContent = `PM2.5 ${Math.round(values.pm25)}`;
    dom.syncState.textContent = source;
  }

  function aqiLabel(value) {
    if (!Number.isFinite(value)) return "";
    if (value <= 50) return "优";
    if (value <= 100) return "良";
    if (value <= 150) return "轻度";
    if (value <= 200) return "中度";
    return "较差";
  }

  function weatherLabel(code) {
    const labels = {
      0: "晴", 1: "晴间多云", 2: "多云", 3: "阴",
      45: "有雾", 48: "雾凇", 51: "细雨", 53: "小雨", 55: "细雨",
      61: "小雨", 63: "中雨", 65: "大雨", 80: "阵雨", 81: "阵雨", 82: "强阵雨",
      95: "雷阵雨", 96: "雷阵雨", 99: "强雷阵雨"
    };
    return labels[code] || "天气变化";
  }

  async function refreshWeather() {
    const content = runtime.content;
    if (!content || runtime.weatherLoading || content.environment.weatherProvider === "none" || (qaEnabled && params.get("offline") === "1")) return;
    runtime.weatherLoading = true;
    const environment = content.environment;
    const latitude = encodeURIComponent(environment.latitude);
    const longitude = encodeURIComponent(environment.longitude);
    const timezone = encodeURIComponent(environment.timezone);
    const forecastUrl = `https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m,weather_code&timezone=${timezone}`;
    const airUrl = `https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${latitude}&longitude=${longitude}&current=us_aqi,pm2_5&timezone=${timezone}`;
    try {
      const [forecastResponse, airResponse] = await Promise.all([fetch(forecastUrl, { signal: AbortSignal.timeout(8000) }), fetch(airUrl, { signal: AbortSignal.timeout(8000) })]);
      if (!forecastResponse.ok || !airResponse.ok) throw new Error("天气服务响应失败");
      const [forecast, air] = await Promise.all([forecastResponse.json(), airResponse.json()]);
      setEnvironmentValues({
        temperature: forecast.current.temperature_2m,
        weather: weatherLabel(forecast.current.weather_code),
        aqi: air.current.us_aqi,
        pm25: air.current.pm2_5
      }, `UPDATED ${new Intl.DateTimeFormat("zh-CN", {
        timeZone: environment.timezone,
        hour: "2-digit",
        minute: "2-digit",
        hour12: false
      }).format(new Date())}`);
    } catch (error) {
      const observed = environment.fallbackObservedAt?.slice(5, 16).replace("T", " ") || "";
      setEnvironmentValues(environment.fallback, observed ? "快照 " + observed : "数据暂不可用");
      dom.errorState.textContent = observed ? "天气与空气质量使用已标注时间的离线快照" : "等待天气与空气质量数据";
    } finally {
      runtime.nextWeatherAt = Date.now() + environment.refreshMinutes * 60_000;
      runtime.weatherLoading = false;
    }
  }

  function resizeStage() {
    const scale = (params.get("fit") === "contain" ? Math.min : Math.max)(window.innerWidth / DESIGN_WIDTH, window.innerHeight / DESIGN_HEIGHT);
    stage.style.setProperty("--cover-scale", String(scale));
    staticCanvas.width = DESIGN_WIDTH * DPR;
    staticCanvas.height = DESIGN_HEIGHT * DPR;
    dynamicCanvas.width = DESIGN_WIDTH * DPR;
    dynamicCanvas.height = DESIGN_HEIGHT * DPR;
    staticContext.setTransform(DPR, 0, 0, DPR, 0, 0);
    dynamicContext.setTransform(DPR, 0, 0, DPR, 0, 0);
    if (runtime.content) drawStaticScene();
  }

  function seededRandom(seed) {
    let state = seed >>> 0;
    return () => {
      state = (Math.imul(state, 1664525) + 1013904223) >>> 0;
      return state / 4294967296;
    };
  }

  function drawCoverImage(context, image, fit) {
    const imageRatio = image.naturalWidth / image.naturalHeight;
    const canvasRatio = DESIGN_WIDTH / DESIGN_HEIGHT;
    const useWidth = fit === "cover" ? imageRatio < canvasRatio : imageRatio > canvasRatio;
    const width = useWidth ? DESIGN_WIDTH : DESIGN_HEIGHT * imageRatio;
    const height = useWidth ? DESIGN_WIDTH / imageRatio : DESIGN_HEIGHT;
    context.drawImage(image, (DESIGN_WIDTH - width) / 2, (DESIGN_HEIGHT - height) / 2, width, height);
  }

  function drawStaticScene() {
    const content = runtime.content;
    const context = staticContext;
    context.save();
    context.setTransform(DPR, 0, 0, DPR, 0, 0);
    context.globalAlpha = 1;
    context.fillStyle = content.background.baseColor;
    context.fillRect(0, 0, DESIGN_WIDTH, DESIGN_HEIGHT);

    const glow = content.background.radialGlow;
    const radial = context.createRadialGradient(
      glow.x * DESIGN_WIDTH,
      glow.y * DESIGN_HEIGHT,
      0,
      glow.x * DESIGN_WIDTH,
      glow.y * DESIGN_HEIGHT,
      glow.radius * Math.max(DESIGN_WIDTH, DESIGN_HEIGHT)
    );
    radial.addColorStop(0, glow.innerColor);
    radial.addColorStop(0.34, content.colors.surface);
    radial.addColorStop(0.72, content.colors.background);
    radial.addColorStop(1, glow.outerColor);
    context.fillStyle = radial;
    context.fillRect(0, 0, DESIGN_WIDTH, DESIGN_HEIGHT);

    if (content.background.imageAssetId && runtime.assets.has(content.background.imageAssetId)) {
      context.save();
      context.globalAlpha = content.background.imageOpacity;
      drawCoverImage(context, runtime.assets.get(content.background.imageAssetId), content.background.imageFit);
      context.restore();
    }

    const decorations = content.staticDecorations;
    decorations.filter((item) => item.type === "lunarField").forEach((item) => drawLunarField(context, item));
    decorations.filter((item) => item.type === "orbitalArcs").forEach((item) => drawOrbitalArcs(context, item, content.colors));
    decorations.filter((item) => item.type === "lunarDust").forEach((item) => drawLunarDust(context, item, 0));
    decorations.filter((item) => item.type === "starField").forEach((item) => drawStarField(context, item, 0));
    decorations.filter((item) => item.type === "terminatorBand").forEach((item) => drawTerminatorBand(context, item, content.colors));
    decorations.filter((item) => item.type === "image").forEach((item) => drawImageDecoration(context, item));
    context.restore();
  }

  function starPattern(decoration) {
    if (runtime.particleFields.has(decoration.id)) return runtime.particleFields.get(decoration.id);
    const random = seededRandom(decoration.seed);
    const stars = Array.from({ length: decoration.count }, (_, index) => ({
      x: random(),
      y: random(),
      depth: index < 240 ? 0 : index < 340 ? 1 : 2,
      size: 0.35 + random() * (index > 340 ? 1.25 : 0.7),
      alpha: 0.12 + random() * (index > 340 ? 0.62 : 0.34),
      phase: random() * Math.PI * 2,
      cool: random() > 0.18
    }));
    runtime.particleFields.set(decoration.id, stars);
    return stars;
  }

  function drawStarField(context, decoration, visualTime = 0) {
    context.save();
    context.globalCompositeOperation = "screen";
    for (const star of starPattern(decoration)) {
      const speed = [0.0000007, 0.0000014, 0.0000024][star.depth];
      const x = ((star.x + visualTime * speed) % 1) * DESIGN_WIDTH;
      const y = ((star.y + visualTime * speed * 0.12) % 1) * DESIGN_HEIGHT;
      const pulse = 0.72 + Math.sin(visualTime * 0.00048 + star.phase) * 0.28;
      const color = star.cool ? "185,216,238" : "235,218,193";
      context.fillStyle = `rgba(${color},${star.alpha * pulse * decoration.opacity})`;
      context.beginPath();
      context.arc(x, y, star.size * (0.82 + star.depth * 0.13), 0, Math.PI * 2);
      context.fill();
      if (star.depth === 2 && star.size > 1.15 && star.alpha > 0.55) {
        context.strokeStyle = `rgba(${color},${star.alpha * pulse * 0.2 * decoration.opacity})`;
        context.lineWidth = 0.6;
        context.beginPath();
        context.moveTo(x - star.size * 3.2, y);
        context.lineTo(x + star.size * 3.2, y);
        context.moveTo(x, y - star.size * 3.2);
        context.lineTo(x, y + star.size * 3.2);
        context.stroke();
      }
    }
    context.restore();
  }

  function drawLunarField(context, decoration) {
    const fieldX = decoration.center[0] * DESIGN_WIDTH;
    const fieldY = decoration.center[1] * DESIGN_HEIGHT;
    const fieldRadius = decoration.radius * Math.min(DESIGN_WIDTH, DESIGN_HEIGHT);
    context.save();
    context.globalCompositeOperation = "screen";
    context.globalAlpha = decoration.opacity;
    const lunarField = context.createRadialGradient(
      fieldX + fieldRadius * 0.22,
      fieldY - fieldRadius * 0.16,
      fieldRadius * 0.05,
      fieldX,
      fieldY,
      fieldRadius
    );
    lunarField.addColorStop(0, "rgba(164,203,232,0.075)");
    lunarField.addColorStop(0.55, "rgba(99,148,190,0.028)");
    lunarField.addColorStop(0.92, "rgba(116,166,204,0.012)");
    lunarField.addColorStop(1, "rgba(0,0,0,0)");
    context.fillStyle = lunarField;
    context.beginPath();
    context.arc(fieldX, fieldY, fieldRadius, 0, Math.PI * 2);
    context.fill();
    context.restore();
  }

  function lunarDustPattern(decoration) {
    if (runtime.particleFields.has(decoration.id)) return runtime.particleFields.get(decoration.id);
    const random = seededRandom(decoration.seed);
    const dust = Array.from({ length: decoration.count }, () => ({
      angle: random() * Math.PI * 2,
      radius: 0.35 + random() * 0.65,
      size: 0.25 + random() * 1.25,
      alpha: 0.025 + random() * 0.12,
      phase: random() * Math.PI * 2
    }));
    runtime.particleFields.set(decoration.id, dust);
    return dust;
  }

  function drawLunarDust(context, decoration, visualTime = 0) {
    const fieldX = decoration.center[0] * DESIGN_WIDTH;
    const fieldY = decoration.center[1] * DESIGN_HEIGHT;
    const fieldRadius = decoration.radius * Math.min(DESIGN_WIDTH, DESIGN_HEIGHT);
    context.save();
    context.globalCompositeOperation = "screen";
    for (const dust of lunarDustPattern(decoration)) {
      const drift = Math.sin(visualTime * 0.000045 + dust.phase) * 0.018;
      const radius = fieldRadius * (dust.radius + drift);
      const angle = dust.angle + visualTime * 0.000006;
      const x = fieldX + Math.cos(angle) * radius;
      const y = fieldY + Math.sin(angle) * radius * decoration.verticalScale;
      context.fillStyle = `rgba(180,212,235,${dust.alpha * (0.72 + Math.sin(visualTime * 0.00035 + dust.phase) * 0.28) * decoration.opacity})`;
      context.beginPath();
      context.arc(x, y, dust.size, 0, Math.PI * 2);
      context.fill();
    }
    context.restore();
  }

  function drawOrbitalArcs(context, decoration, colors) {
    const centerX = decoration.center[0] * DESIGN_WIDTH;
    const centerY = decoration.center[1] * DESIGN_HEIGHT;
    context.save();
    context.strokeStyle = colors[decoration.colorRole];
    context.lineWidth = decoration.lineWidth;
    context.globalAlpha = decoration.opacity;
    for (const radius of decoration.radii) {
      context.beginPath();
      context.arc(centerX, centerY, radius * DESIGN_HEIGHT, decoration.startAngle, decoration.endAngle);
      context.stroke();
    }
    context.restore();
  }

  function drawTerminatorBand(context, decoration, colors) {
    const x = decoration.x * DESIGN_WIDTH;
    const y = decoration.y * DESIGN_HEIGHT;
    const width = decoration.width * DESIGN_WIDTH;
    const height = decoration.height * DESIGN_HEIGHT;
    const gradient = context.createLinearGradient(x + width * 0.14, 0, x + width * 0.83, 0);
    gradient.addColorStop(0, "rgba(0,0,0,0)");
    gradient.addColorStop(0.46, "rgba(1,4,9,0.05)");
    gradient.addColorStop(0.5, `rgba(150,197,231,${0.035 * decoration.opacity})`);
    gradient.addColorStop(0.54, "rgba(1,4,9,0.08)");
    gradient.addColorStop(1, "rgba(0,0,0,0)");
    context.save();
    context.fillStyle = gradient;
    context.fillRect(x, y, width, height);
    context.restore();
    void colors;
  }

  function drawImageDecoration(context, decoration) {
    const image = runtime.assets.get(decoration.assetId);
    if (!image) return;
    const boxX = decoration.x * DESIGN_WIDTH;
    const boxY = decoration.y * DESIGN_HEIGHT;
    const boxWidth = decoration.width * DESIGN_WIDTH;
    const boxHeight = decoration.height * DESIGN_HEIGHT;
    const imageRatio = image.naturalWidth / image.naturalHeight;
    const boxRatio = boxWidth / boxHeight;
    const useWidth = decoration.fit === "cover" ? imageRatio < boxRatio : imageRatio > boxRatio;
    const width = useWidth ? boxWidth : boxHeight * imageRatio;
    const height = useWidth ? boxWidth / imageRatio : boxHeight;
    context.save();
    context.globalAlpha = decoration.opacity;
    context.beginPath();
    context.rect(boxX, boxY, boxWidth, boxHeight);
    context.clip();
    context.drawImage(image, boxX + (boxWidth - width) / 2, boxY + (boxHeight - height) / 2, width, height);
    context.restore();
  }

  function derivatives(state, pendulum) {
    const [angle1, velocity1, angle2, velocity2] = state;
    const { physicsLength1: length1, physicsLength2: length2, mass1, mass2, gravity } = pendulum;
    const delta = angle1 - angle2;
    const denominator = 2 * mass1 + mass2 - mass2 * Math.cos(2 * delta);
    const acceleration1 = (
      -gravity * (2 * mass1 + mass2) * Math.sin(angle1)
      - mass2 * gravity * Math.sin(angle1 - 2 * angle2)
      - 2 * Math.sin(delta) * mass2 * (
        velocity2 * velocity2 * length2 + velocity1 * velocity1 * length1 * Math.cos(delta)
      )
    ) / (length1 * denominator);
    const acceleration2 = (
      2 * Math.sin(delta) * (
        velocity1 * velocity1 * length1 * (mass1 + mass2)
        + gravity * (mass1 + mass2) * Math.cos(angle1)
        + velocity2 * velocity2 * length2 * mass2 * Math.cos(delta)
      )
    ) / (length2 * denominator);
    return [velocity1, acceleration1, velocity2, acceleration2];
  }

  function addScaledState(state, derivative, scale) {
    return state.map((value, index) => value + derivative[index] * scale);
  }

  function integratePhysics(step) {
    const current = [
      runtime.pendulum.angle1,
      runtime.pendulum.velocity1,
      runtime.pendulum.angle2,
      runtime.pendulum.velocity2
    ];
    const parameters = runtime.content.pendulum;
    const k1 = derivatives(current, parameters);
    const k2 = derivatives(addScaledState(current, k1, step / 2), parameters);
    const k3 = derivatives(addScaledState(current, k2, step / 2), parameters);
    const k4 = derivatives(addScaledState(current, k3, step), parameters);
    const next = current.map((value, index) => value + step * (
      k1[index] + 2 * k2[index] + 2 * k3[index] + k4[index]
    ) / 6);
    runtime.pendulum.angle1 = next[0];
    runtime.pendulum.velocity1 = next[1];
    runtime.pendulum.angle2 = next[2];
    runtime.pendulum.velocity2 = next[3];
  }

  function pendulumPoints() {
    const pendulum = runtime.content.pendulum;
    const anchor = {
      x: pendulum.anchor[0] * DESIGN_WIDTH,
      y: pendulum.anchor[1] * DESIGN_HEIGHT
    };
    const joint = {
      x: anchor.x + pendulum.length1 * Math.sin(runtime.pendulum.angle1),
      y: anchor.y + pendulum.length1 * Math.cos(runtime.pendulum.angle1)
    };
    const end = {
      x: joint.x + pendulum.length2 * Math.sin(runtime.pendulum.angle2),
      y: joint.y + pendulum.length2 * Math.cos(runtime.pendulum.angle2)
    };
    return { anchor, joint, end };
  }

  function drawImageNode(context, point, element) {
    const image = runtime.assets.get(element.assetId);
    if (!image) return;
    context.save();
    context.translate(point.x, point.y);
    context.rotate(element.rotation || 0);
    // Generated glass interiors are near-opaque. This backing guarantees that
    // rods cannot show through the moving bob at any crossing angle.
    context.fillStyle = runtime.content.colors.background;
    context.beginPath();
    context.ellipse(0, 0, element.width * 0.427, element.height * 0.427, 0, 0, Math.PI * 2);
    context.fill();
    if (element.shadow !== false) {
      context.shadowColor = runtime.content.colors.shadow;
      context.shadowBlur = 12;
      context.shadowOffsetY = 5;
    }
    context.drawImage(image, -element.width / 2, -element.height / 2, element.width, element.height);
    context.restore();
  }

  function drawRod(context, from, to, colors, intensity = 1) {
    if (runtime.content.pendulum.rodStyle === "brass") {
      const length = Math.hypot(to.x - from.x, to.y - from.y);
      const nx = -(to.y - from.y) / length, ny = (to.x - from.x) / length;
      context.save();
      context.lineCap = "round";
      for (const [width, color, offset] of [[13, colors.shadow, 1], [9, "#493625", 0], [6, colors.rod, -0.2], [1.35, "#f2d3a0", -2]]) {
        context.lineWidth = width;
        context.strokeStyle = color;
        context.beginPath();
        context.moveTo(from.x + nx * offset, from.y + ny * offset);
        context.lineTo(to.x + nx * offset, to.y + ny * offset);
        context.stroke();
      }
      context.restore();
      return;
    }
    const gradient = context.createLinearGradient(from.x, from.y, to.x, to.y);
    gradient.addColorStop(0, `rgba(105,148,183,${0.3 * intensity})`);
    gradient.addColorStop(0.52, `rgba(222,236,246,${0.72 * intensity})`);
    gradient.addColorStop(1, `rgba(133,181,216,${0.42 * intensity})`);
    context.save();
    context.globalCompositeOperation = "screen";
    context.strokeStyle = gradient;
    context.lineWidth = 1.4;
    context.shadowColor = "rgba(139,190,225,0.3)";
    context.shadowBlur = 11;
    context.beginPath();
    context.moveTo(from.x, from.y);
    context.lineTo(to.x, to.y);
    context.stroke();
    context.shadowBlur = 0;
    context.strokeStyle = "rgba(229,240,247,0.15)";
    context.lineWidth = 0.55;
    context.beginPath();
    context.moveTo(from.x + 2, from.y - 1);
    context.lineTo(to.x + 2, to.y - 1);
    context.stroke();
    context.restore();
    void colors;
  }

  function drawMetalRing(context, point, element) {
    const r = element.radius, w = Math.min(element.rimWidth, r * 0.48);
    const warm = element.material === "champagne";
    const palette = warm
      ? ["#fff2d7", "#c8ac7e", "#64543c", "#e5cca1", "#847050"]
      : ["#f5f9fb", "#acb9c2", "#4a555e", "#d9e2e8", "#75848e"];
    context.save();
    context.translate(point.x, point.y);
    // Open centre: only the annular rim is painted. Light stays in world space.
    context.beginPath();
    context.arc(0, 0, r - w / 2, 0, Math.PI * 2);
    context.lineWidth = w + 1.6;
    context.strokeStyle = warm ? "#302a20" : "#242e33";
    context.stroke();
    const metal = context.createLinearGradient(-r * 0.7, -r, r * 0.8, r);
    [0, 0.28, 0.52, 0.72, 1].forEach((stop, i) => metal.addColorStop(stop, palette[i]));
    context.lineWidth = w;
    context.strokeStyle = metal;
    context.shadowBlur = r > 8 ? 5 : 3;
    context.shadowColor = warm ? "rgba(216,186,135,0.22)" : "rgba(198,218,232,0.2)";
    context.stroke();
    context.shadowBlur = 0;
    context.lineWidth = 0.65;
    context.strokeStyle = warm ? "rgba(255,244,222,0.76)" : "rgba(245,250,255,0.82)";
    context.beginPath();
    context.arc(0, 0, r - 0.35, Math.PI * 1.08, Math.PI * 1.78);
    context.stroke();
    context.strokeStyle = warm ? "rgba(237,211,165,0.36)" : "rgba(215,231,242,0.4)";
    context.beginPath();
    context.arc(0, 0, r - w + 0.25, Math.PI * 0.06, Math.PI * 0.66);
    context.stroke();
    context.restore();
  }

  function drawBoundRod(context, points, fromBinding, toBinding, colors, intensity) {
    const from = points[fromBinding], to = points[toBinding];
    const length = Math.hypot(to.x - from.x, to.y - from.y);
    const ux = (to.x - from.x) / length, uy = (to.y - from.y) / length;
    const rimRadius = binding => runtime.content.dynamicElements.find(e => e.type === "metalRingNode" && e.binding === binding)?.radius || 0;
    const a = rimRadius(fromBinding), b = rimRadius(toBinding);
    // Attach to the rim, without filling the ring hole or changing physics lengths.
    drawRod(context, { x: from.x + ux * a, y: from.y + uy * a },
      { x: to.x - ux * b, y: to.y - uy * b }, colors, intensity);
  }

  function drawGlow(context, x, y, radius, core, halo, strength = 1) {
    const gradient = context.createRadialGradient(x, y, 0, x, y, radius * 4.6);
    gradient.addColorStop(0, core);
    gradient.addColorStop(0.18, core);
    gradient.addColorStop(0.48, halo);
    gradient.addColorStop(1, "rgba(0,0,0,0)");
    context.save();
    context.globalAlpha = strength;
    context.fillStyle = gradient;
    context.beginPath();
    context.arc(x, y, radius * 4.6, 0, Math.PI * 2);
    context.fill();
    context.restore();
  }

  function drawNewMoon(context, point, radius) {
    context.save();
    drawGlow(context, point.x, point.y, radius * 0.72, "rgba(93,137,170,0.16)", "rgba(82,135,178,0.035)", 0.9);
    const disc = context.createRadialGradient(
      point.x - radius * 0.2,
      point.y - radius * 0.25,
      radius * 0.05,
      point.x,
      point.y,
      radius
    );
    disc.addColorStop(0, "rgba(16,28,40,0.96)");
    disc.addColorStop(0.7, "rgba(4,10,17,0.99)");
    disc.addColorStop(1, "rgba(1,4,8,1)");
    context.fillStyle = disc;
    context.beginPath();
    context.arc(point.x, point.y, radius, 0, Math.PI * 2);
    context.fill();
    context.strokeStyle = "rgba(173,210,236,0.42)";
    context.lineWidth = 1.15;
    context.beginPath();
    context.arc(point.x, point.y, radius + 0.5, -1.28, 1.28);
    context.stroke();
    context.restore();
  }

  function drawCrescentMoon(context, point, radius) {
    context.save();
    drawGlow(context, point.x, point.y, radius * 0.9, "rgba(204,228,243,0.42)", "rgba(98,167,215,0.07)", 0.82);
    context.fillStyle = "rgba(215,231,241,0.82)";
    context.beginPath();
    context.arc(point.x, point.y, radius, 0, Math.PI * 2);
    context.fill();
    const shadow = context.createRadialGradient(
      point.x - radius * 0.42,
      point.y,
      radius * 0.08,
      point.x - radius * 0.3,
      point.y,
      radius
    );
    shadow.addColorStop(0, "rgba(4,9,16,1)");
    shadow.addColorStop(0.78, "rgba(5,11,18,0.99)");
    shadow.addColorStop(1, "rgba(13,27,40,0.91)");
    context.fillStyle = shadow;
    context.beginPath();
    context.arc(point.x - radius * 0.3, point.y, radius * 0.98, 0, Math.PI * 2);
    context.fill();
    context.strokeStyle = "rgba(214,233,245,0.56)";
    context.lineWidth = 1;
    context.beginPath();
    context.arc(point.x, point.y, radius, -1.18, 1.18);
    context.stroke();
    context.restore();
  }

  function craterPattern(element) {
    if (runtime.nodeTextures.has(element.id)) return runtime.nodeTextures.get(element.id);
    const random = seededRandom(element.surfaceSeed || 1);
    const craters = Array.from({ length: 28 }, () => ({
      x: random() * 0.82 - 0.04,
      y: random() * 1.56 - 0.78,
      radius: 0.018 + random() * 0.065,
      alpha: 0.08 + random() * 0.18
    }));
    runtime.nodeTextures.set(element.id, craters);
    return craters;
  }

  function drawQuarterMoon(context, point, element, visualTime) {
    const radius = element.radius;
    context.save();
    drawGlow(context, point.x, point.y, radius * 0.83, "rgba(222,237,247,0.35)", "rgba(105,170,216,0.075)", 0.95);
    context.beginPath();
    context.arc(point.x, point.y, radius, 0, Math.PI * 2);
    context.clip();

    const surface = context.createRadialGradient(
      point.x + radius * 0.38,
      point.y - radius * 0.38,
      radius * 0.03,
      point.x,
      point.y,
      radius * 1.2
    );
    surface.addColorStop(0, "#f0f5f7");
    surface.addColorStop(0.42, "#c7d4dc");
    surface.addColorStop(0.78, "#8197a8");
    surface.addColorStop(1, "#425466");
    context.fillStyle = surface;
    context.fillRect(point.x - radius, point.y - radius, radius * 2, radius * 2);

    for (const crater of craterPattern(element)) {
      const x = point.x + crater.x * radius;
      const y = point.y + crater.y * radius;
      const craterRadius = crater.radius * radius;
      const gradient = context.createRadialGradient(
        x - craterRadius * 0.3,
        y - craterRadius * 0.3,
        0,
        x,
        y,
        craterRadius
      );
      gradient.addColorStop(0, `rgba(238,245,248,${crater.alpha * 0.48})`);
      gradient.addColorStop(0.52, `rgba(82,103,119,${crater.alpha})`);
      gradient.addColorStop(1, "rgba(28,42,54,0)");
      context.fillStyle = gradient;
      context.beginPath();
      context.arc(x, y, craterRadius, 0, Math.PI * 2);
      context.fill();
    }

    const boundaryDrift = Math.sin(visualTime * 0.00022) * radius * 0.012;
    const shadow = context.createLinearGradient(point.x - radius, 0, point.x + radius, 0);
    shadow.addColorStop(0, "rgba(1,4,8,0.995)");
    shadow.addColorStop(0.47, "rgba(3,8,14,0.99)");
    shadow.addColorStop(0.498, "rgba(21,38,52,0.8)");
    shadow.addColorStop(0.515, "rgba(0,0,0,0.06)");
    shadow.addColorStop(1, "rgba(0,0,0,0)");
    context.save();
    context.translate(boundaryDrift, 0);
    context.fillStyle = shadow;
    context.fillRect(point.x - radius, point.y - radius, radius * 2, radius * 2);
    context.restore();
    context.restore();

    context.save();
    context.strokeStyle = "rgba(221,238,248,0.78)";
    context.lineWidth = 1.15;
    context.beginPath();
    context.arc(point.x, point.y, radius, -1.5, 1.5);
    context.stroke();
    context.strokeStyle = "rgba(97,145,180,0.26)";
    context.beginPath();
    context.arc(point.x, point.y, radius, 1.5, 4.78);
    context.stroke();
    context.restore();

    const pulse = (Math.sin(visualTime * 0.00062) + 1) * 0.5;
    if (pulse > 0.94) {
      const progress = (pulse - 0.94) / 0.06;
      context.save();
      context.strokeStyle = `rgba(159,205,235,${(1 - progress) * 0.13})`;
      context.lineWidth = 0.8;
      context.beginPath();
      context.arc(point.x, point.y, 90 + progress * 50, 0, Math.PI * 2);
      context.stroke();
      context.restore();
    }
  }

  function drawSimpleMoon(context, point, element, colors) {
    const radius = element.radius;
    context.save();
    drawGlow(context, point.x, point.y, radius * 0.8, `${colors.ink}55`, `${colors.accent}12`, 0.85);
    context.fillStyle = element.phase === "new" ? colors.surface : colors.ink;
    context.beginPath();
    context.arc(point.x, point.y, radius, 0, Math.PI * 2);
    context.fill();
    context.restore();
  }

  function drawPhaseNode(context, point, element, colors, visualTime) {
    if (element.phase === "new") drawNewMoon(context, point, element.radius);
    else if (element.phase === "crescent") drawCrescentMoon(context, point, element.radius);
    else if (element.phase === "firstQuarter") drawQuarterMoon(context, point, element, visualTime);
    else drawSimpleMoon(context, point, element, colors);
  }

  function drawTrail(context, colors, now) {
    const trailConfig = runtime.content.pendulum.trail;
    if (!trailConfig.enabled || runtime.pendulum.trail.length < 2) return;
    runtime.pendulum.trail = runtime.pendulum.trail.filter((point) => now - point.at <= trailConfig.lifetimeMs);
    const points = runtime.pendulum.trail;
    context.save();
    context.globalCompositeOperation = "screen";
    context.strokeStyle = colors.trail;
    context.lineWidth = trailConfig.width;
    for (let index = 1; index < points.length; index += 1) {
      const age = (now - points[index].at) / Math.max(1, trailConfig.lifetimeMs);
      context.globalAlpha = Math.max(0, trailConfig.alpha * (1 - age));
      context.beginPath();
      context.moveTo(points[index - 1].x, points[index - 1].y);
      context.lineTo(points[index].x, points[index].y);
      context.stroke();
    }
    context.restore();
  }

  function drawDynamicScene(now) {
    const content = runtime.content;
    const context = dynamicContext;
    const points = pendulumPoints();
    const trailConfig = content.pendulum.trail;
    const visualTime = now - runtime.startedAt;
    if (trailConfig.enabled) {
      runtime.pendulum.trail.push({ x: points.end.x, y: points.end.y, at: now });
      if (runtime.pendulum.trail.length > trailConfig.maxPoints) runtime.pendulum.trail.shift();
    }

    context.setTransform(DPR, 0, 0, DPR, 0, 0);
    context.clearRect(0, 0, DESIGN_WIDTH, DESIGN_HEIGHT);
    content.dynamicElements
      .filter((element) => element.type === "movingLunarDust")
      .forEach((element) => drawLunarDust(context, element, visualTime));
    content.dynamicElements
      .filter((element) => element.type === "movingStarField")
      .forEach((element) => drawStarField(context, element, visualTime));
    drawTrail(context, content.colors, now);
    drawBoundRod(context, points, "anchor", "joint", content.colors, 0.9);
    drawBoundRod(context, points, "joint", "end", content.colors, 1);

    const binding = {
      anchor: points.anchor,
      joint: points.joint,
      end: points.end
    };
    // Stable front-view layering: moving end bob occludes the fixed anchor.
    for (const nodeBinding of ["anchor", "joint", "end"]) {
      for (const element of content.dynamicElements.filter(e => e.binding === nodeBinding)) {
        if (element.type === "phaseNode") drawPhaseNode(context, binding[nodeBinding], element, content.colors, visualTime);
        if (element.type === "imageNode") drawImageNode(context, binding[nodeBinding], element);
        if (element.type === "metalRingNode") drawMetalRing(context, binding[nodeBinding], element);
      }
    }
  }

  function formatClock(now, timezone) {
    const parts = Object.fromEntries(new Intl.DateTimeFormat("zh-CN", {
      timeZone: timezone,
      year: "numeric",
      month: "2-digit",
      day: "2-digit",
      weekday: "long",
      hour: "2-digit",
      minute: "2-digit",
      second: "2-digit",
      hour12: false
    }).formatToParts(now).map((part) => [part.type, part.value]));
    return {
      hourMinute: `${parts.hour}:${parts.minute}`,
      seconds: parts.second,
      date: `${parts.year}.${parts.month}.${parts.day} ${parts.weekday}`
    };
  }

  function updateClock(now) {
    const second = Math.floor(now.getTime() / 1000);
    if (second === runtime.lastClockSecond || !runtime.content) return;
    runtime.lastClockSecond = second;
    const timezone = runtime.content.environment.timezone;
    const formatted = formatClock(now, timezone);
    dom.clockHm.textContent = formatted.hourMinute;
    dom.clockSeconds.textContent = formatted.seconds;
    dom.clockTime.dateTime = now.toISOString();
    dom.clockDate.textContent = formatted.date;
    const dateParts = new Intl.DateTimeFormat("en-CA", {timeZone:timezone,year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(now);
    const values = Object.fromEntries(dateParts.map(x=>[x.type,x.value]));
    const dateKey = values.year + "-" + values.month + "-" + values.day;
    const day = Math.floor((Date.UTC(+values.year,+values.month-1,+values.day)-Date.parse(runtime.content.brandText.foundedDate+"T00:00:00Z"))/86400000)+1;
    dom.companyDay.textContent = String(day).padStart(4, "0");
    try {
      const lunar = new Intl.DateTimeFormat("zh-CN-u-ca-chinese", {timeZone:timezone,month:"long",day:"numeric"}).format(now);
      dom.lunarDataLabel.textContent = dateKey === runtime.content.date ? runtime.content.environment.lunarDataLabel : "农历 " + lunar;
    } catch {}
    if (runtime.preview && params.get("previewDate") === runtime.content.date) {
      dom.clockDate.textContent = new Intl.DateTimeFormat("zh-CN", { timeZone:timezone,year:"numeric",month:"2-digit",day:"2-digit",weekday:"long" }).format(new Date(runtime.content.date+"T12:00:00+08:00")).replaceAll("/",".");
      dom.companyDay.textContent = String(runtime.content.brandText.companyDay).padStart(4,"0");
      dom.lunarDataLabel.textContent = runtime.content.environment.lunarDataLabel;
    }
  }

  function minutesInTimezone(now, timezone) {
    const parts = Object.fromEntries(new Intl.DateTimeFormat("en-GB", {
      timeZone: timezone,
      hour: "2-digit",
      minute: "2-digit",
      hourCycle: "h23"
    }).formatToParts(now).map((part) => [part.type, part.value]));
    return Number(parts.hour) * 60 + Number(parts.minute);
  }

  function parseClock(value) {
    const [hours, minutes] = value.split(":").map(Number);
    return hours * 60 + minutes;
  }

  function isInsidePlaybackWindow(now) {
    if (runtime.preview) return true;
    const environment = runtime.content.environment;
    const minutes = minutesInTimezone(now, environment.timezone);
    return minutes >= parseClock(environment.playbackWindow.start)
      && minutes < parseClock(environment.playbackWindow.end);
  }

  function stopAnimation() {
    if (runtime.frameId !== null) {
      cancelAnimationFrame(runtime.frameId);
      runtime.frameId = null;
    }
    runtime.lastFrameAt = 0;
    runtime.accumulator = 0;
    lastPhysicsAt = 0;
  }

  function scheduleActivityCheck() {
    window.clearTimeout(runtime.activityTimer);
    runtime.activityTimer = window.setTimeout(checkPlaybackState, 30_000);
  }

  function checkPlaybackState() {
    if (!runtime.content) return;
    const active = !qaPaused && !document.hidden && isInsidePlaybackWindow(new Date());
    renderer.classList.toggle("is-blackout", !runtime.preview && !isInsidePlaybackWindow(new Date()));
    if (active) queueFrame();
    else stopAnimation();
    scheduleActivityCheck();
  }

  function renderDynamicFrame(timestamp) {
    runtime.frameId = null;
    if (!runtime.content || qaPaused || document.hidden || !isInsidePlaybackWindow(new Date())) {
      stopAnimation();
      return;
    }

    const fps = clamp(runtime.content.pendulum.fps || DEFAULT_FPS, 1, MAX_FPS);
    const frameInterval = 1000 / fps;
    if (runtime.lastFrameAt === 0) runtime.lastFrameAt = timestamp;
    const elapsed = timestamp - runtime.lastFrameAt;
    if (lastPhysicsAt === 0) lastPhysicsAt = timestamp;
    if (elapsed >= frameInterval) {
      const paintStarted = performance.now();
      const seconds = Math.min(timestamp - lastPhysicsAt, 100) / 1000;
      lastPhysicsAt = timestamp;
      const physicsHz = clamp(runtime.content.pendulum.physicsHz, 30, MAX_PHYSICS_HZ);
      const physicsStep = 1 / physicsHz;
      runtime.accumulator += seconds * runtime.content.pendulum.timeScale;
      let physicsSteps = 0;
      while (runtime.accumulator >= physicsStep && physicsSteps < 12) {
        integratePhysics(physicsStep);
        runtime.accumulator -= physicsStep;
        physicsSteps += 1;
        qaMetrics.physicsSteps += 1;
        qaMetrics.simulatedSeconds += physicsStep;
      }
      runtime.lastFrameAt = timestamp - (elapsed % frameInterval);
      drawDynamicScene(timestamp);
      qaMetrics.frames += 1;
      qaMetrics.maximumPaintMs = Math.max(qaMetrics.maximumPaintMs, performance.now()-paintStarted);
      updateClock(new Date());
      if (Date.now() >= runtime.nextWeatherAt) void refreshWeather();
    }
    queueFrame();
  }

  async function loadContent() {
    stopAnimation();
    renderer.dataset.status = "loading";
    dom.errorState.textContent = "";
    let content;
    let source;
    let assets;
    try {
      source = safeContentPath();
      content = EMBEDDED_CONTENT ? JSON.parse(EMBEDDED_CONTENT.textContent) : await fetchJson(source);
      assertRuntimeContract(content);
      assets = await loadAssets(content);
    } catch (primaryError) {
      source = FALLBACK_CONTENT_PATH;
      content = await fetchJson(source);
      assertRuntimeContract(content);
      assets = await loadAssets(content);
      dom.errorState.textContent = "内容离线 · 使用本地回退";
      console.warn(primaryError);
    }

    runtime.content = content;
    runtime.assets = assets;
    runtime.source = source;
    renderer.dataset.contentSource = source;
    applyPalette(content);
    applyTextContent(content);
    resetPhysics(content);
    setEnvironmentValues(content.environment.fallback, "快照 " + (content.environment.fallbackObservedAt?.slice(5,16).replace("T"," ") || "--"));
    runtime.nextWeatherAt = 0;
    resizeStage();
    drawDynamicScene(performance.now());
    updateClock(new Date());
    renderer.dataset.status = "ready";
    if (qaEnabled) {
      window.__displayQA = {
        state: () => ({ points:pendulumPoints(), metrics:{...qaMetrics}, state:{...runtime.pendulum,trail:runtime.pendulum.trail.length}, ready:renderer.dataset.status, framePending:runtime.frameId!==null, hidden:document.hidden }),
        pause: () => {qaPaused=true;stopAnimation();},
        resume: () => {qaPaused=false;checkPlaybackState();},
        sample: seconds => {
          qaPaused=true; stopAnimation(); resetPhysics(runtime.content);
          const steps=Math.round(Math.max(0,Math.min(3600,seconds))*runtime.content.pendulum.timeScale*runtime.content.pendulum.physicsHz);
          for(let n=0;n<steps;n++) integratePhysics(1/runtime.content.pendulum.physicsHz);
          drawDynamicScene(performance.now());return window.__displayQA.state();
        },
        audit: seconds => {
          qaPaused=true;stopAnimation();resetPhysics(runtime.content);
          const nodes=runtime.content.dynamicElements.filter(x=>x.binding);
          const boxes=[...document.querySelectorAll(".brand,.phase,.science-note,.environment,.clock")].map(e=>({name:e.className,left:e.offsetLeft,top:e.offsetTop,right:e.offsetLeft+e.offsetWidth,bottom:e.offsetTop+e.offsetHeight}));
          const steps=Math.round(Math.max(0,Math.min(3600,seconds))*runtime.content.pendulum.timeScale*runtime.content.pendulum.physicsHz);
          let collisions=0,clipped=0,samples=0;const envelope={minX:Infinity,minY:Infinity,maxX:-Infinity,maxY:-Infinity};const conflictExamples=[];
          for(let n=0;n<steps;n++){
            integratePhysics(1/runtime.content.pendulum.physicsHz);
            if(n%4)continue;samples++;
            const p=pendulumPoints();
            for(const node of nodes){
              const point=p[node.binding], rx=node.width?node.width*.48:node.radius+5,ry=node.height?node.height*.48:node.radius+5;
              const b={left:point.x-rx,top:point.y-ry,right:point.x+rx,bottom:point.y+ry};
              envelope.minX=Math.min(envelope.minX,b.left);envelope.minY=Math.min(envelope.minY,b.top);envelope.maxX=Math.max(envelope.maxX,b.right);envelope.maxY=Math.max(envelope.maxY,b.bottom);
              if(b.left<0||b.top<0||b.right>1280||b.bottom>960)clipped++;
              for(const box of boxes){if(b.left<box.right&&b.right>box.left&&b.top<box.bottom&&b.bottom>box.top){
                collisions++;if(conflictExamples.length<5)conflictExamples.push({t:n/runtime.content.pendulum.physicsHz/runtime.content.pendulum.timeScale,node:node.id,box:box.name});
              }}
            }
          }
          drawDynamicScene(performance.now());
          return {seconds,samples,collisions,clipped,envelope,conflictExamples,finite:[runtime.pendulum.angle1,runtime.pendulum.angle2,runtime.pendulum.velocity1,runtime.pendulum.velocity2].every(Number.isFinite)};
        }
      };
    }
    void refreshWeather();
    checkPlaybackState();
  }

  window.addEventListener("resize", resizeStage, { passive: true });
  document.addEventListener("visibilitychange", checkPlaybackState);
  window.addEventListener("renderer:reload", () => void loadContent());
  window.addEventListener("beforeunload", stopAnimation);

  void loadContent().catch((error) => {
    renderer.dataset.status = "error";
    dom.errorState.textContent = "固定渲染器启动失败";
    console.error(error);
    stopAnimation();
  });
})();
</script>
  </body>
</html>
